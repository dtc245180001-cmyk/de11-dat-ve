
services:
  web:
    build: .
    container_name: de11-web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./app:/var/www/html
    environment:
      DB_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - db
    networks:
      - de11-network

  db:
    image: mysql:8.0
    container_name: de11-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - de11-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: de11-phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
    networks:
      - de11-network

  nginx:
    image: nginx:alpine
    container_name: de11-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web
    networks:
      - de11-network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: de11-nginx-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9113:9113"
    command:
      - --nginx.scrape-uri=http://nginx/stub_status
    depends_on:
      - nginx
    networks:
      - de11-network

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: de11-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=200MB
    depends_on:
      - nginx-exporter
    networks:
      - de11-network

  grafana:
    image: grafana/grafana:12.2.1
    container_name: de11-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - de11-network

  loki:
    image: grafana/loki:3.5.5
    container_name: de11-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - de11-network

  promtail:
    image: grafana/promtail:3.5.5
    container_name: de11-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./loki/promtail-data:/tmp
      - ./logs/nginx:/var/log/nginx:ro
    depends_on:
      - loki
      - nginx
    networks:
      - de11-network

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  de11-network:
    driver: bridge
